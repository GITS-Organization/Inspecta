name: inspecta
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  #Firebase 
  firebase_core: ^4.14.0
  firebase_crashlytics: ^5.1.0
  firebase_auth: ^6.7.0
  cloud_firestore: ^6.10.0

  # Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences:

  # UI utils
  qr_code_scanner_plus: ^2.0.8+1
  image_picker: ^1.2.3
  modal_progress_hud_nsn: ^0.5.1
  hexcolor: ^3.0.1
  cached_network_image: ^3.3.1
  lottie: ^3.1.0
  flutter_svg: ^2.0.10+1
  timer_count_down: ^2.2.0
  percent_indicator: ^4.2.3
  intl_phone_field: ^3.2.0
  package_info_plus: ^9.0.1
  wakelock_plus: ^1.4.0
  table_calendar: ^3.2.0
  intl: ^0.20.2
  equatable: ^2.0.5
  url_launcher: ^6.3.1
  pdf: ^3.11.1
  printing: ^5.13.4

  # Network
  dio: ^5.8.0+1
  pretty_dio_logger: ^1.4.0
  retrofit: 4.9.2
  http: ^1.2.2

  # Dependency injection.
  get_it: ^8.0.3

  # JSON code generation.
  json_annotation: ^4.11.0
  freezed: ^3.2.2
  freezed_annotation: ^3.1.0
  http_parser: ^4.0.2

  # Responsive
  responsive_framework: ^1.5.1

  # State management
  flutter_bloc: ^9.1.1


  cupertino_icons: ^1.0.9
  skeletonizer: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  json_serializable: ^6.13.1
  retrofit_generator: ^10.2.3
  build_runner: ^2.13.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/pngs/
    - assets/svgs/
    - assets/jsons/

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/cairo/Cairo-Regular.ttf
        - asset: assets/fonts/cairo/Cairo-Medium.ttf
          weight: 500
        - asset: assets/fonts/cairo/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/cairo/Cairo-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-Regular.ttf
        - asset: assets/fonts/inter/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/inter/Inter-Bold.ttf
          weight: 700
