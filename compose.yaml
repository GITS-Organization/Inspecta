services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Inspecta: Data Source=/data/inspecta.db
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-Inspecta.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Inspecta.Client}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Cors__AllowedOriginsCsv: ${CORS_ALLOWED_ORIGINS:-}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__FullName: ${BOOTSTRAP_ADMIN_FULL_NAME:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - inspecta-data:/data

volumes:
  inspecta-data:
