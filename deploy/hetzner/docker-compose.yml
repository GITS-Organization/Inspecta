# Inspecta on one Hetzner Cloud server: Caddy (HTTPS) -> API -> PostgreSQL.
# Run from this folder: `docker compose up -d --build`. All secrets come from the `.env` file next to this one (see .env.example).
# The database is on the internal network only: nothing but Caddy listens on the internet (ports 80 and 443).

services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?Set API_DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    networks: [edge]

  api:
    build:
      context: ../..
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_HTTP_PORTS: "8080"
      ConnectionStrings__Inspecta: "Host=db;Port=5432;Database=${POSTGRES_DB:-inspecta};Username=${POSTGRES_USER:-inspecta};Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Jwt__Issuer: ${JWT_ISSUER:-Inspecta.Api}
      Jwt__Audience: ${JWT_AUDIENCE:-Inspecta.Client}
      IMAP_ENCRYPTION_KEY: ${IMAP_ENCRYPTION_KEY:?Set IMAP_ENCRYPTION_KEY in .env}
      Swagger__Enabled: ${SWAGGER_ENABLED:-false}
      Cors__AllowedOriginsCsv: ${CORS_ALLOWED_ORIGINS:-}
      Certificates__PublicBaseUrl: ${CERTIFICATES_PUBLIC_BASE_URL:-https://${API_DOMAIN}}
      QuoteDelivery__Enabled: ${QUOTE_DELIVERY_ENABLED:-false}
      CertificateDelivery__Enabled: ${CERTIFICATE_DELIVERY_ENABLED:-false}
      EmailSync__IntervalSeconds: ${EMAIL_SYNC_INTERVAL_SECONDS:-15}
      JobReports__RetentionDays: ${JOB_REPORTS_RETENTION_DAYS:-30}
      JobReports__MaxEmailBytes: ${JOB_REPORTS_MAX_EMAIL_BYTES:-17825792}
      BootstrapAdmin__Email: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BootstrapAdmin__FullName: ${BOOTSTRAP_ADMIN_FULL_NAME:-}
      BootstrapAdmin__Password: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      MicrosoftOAuth__ClientId: ${MICROSOFT_OAUTH_CLIENT_ID:-}
      MicrosoftOAuth__ClientSecret: ${MICROSOFT_OAUTH_CLIENT_SECRET:-}
      MicrosoftOAuth__RedirectUri: ${MICROSOFT_OAUTH_REDIRECT_URI:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # The runtime image has no curl: a tiny TCP + HTTP check with bash only.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n 1 <&3 | grep -q '200'"]
      interval: 15s
      timeout: 5s
      retries: 6
      start_period: 60s
    networks: [edge, internal]

  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-inspecta}
      POSTGRES_USER: ${POSTGRES_USER:-inspecta}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-inspecta} -d ${POSTGRES_DB:-inspecta}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

networks:
  # `edge` reaches the internet through Caddy; `internal` has no route out and holds the database.
  edge:
  internal:
    internal: true

volumes:
  pgdata:
  caddy_data:
  caddy_config:
